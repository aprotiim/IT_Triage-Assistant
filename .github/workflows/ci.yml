name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp_server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: orchestrator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Live-model integration tests in tests/test_live_fanout.py are
      # skipped automatically here (no RUN_LIVE_ADK_TESTS / GCP creds) — see
      # README "Testing strategy" for why that split is deliberate.
      - run: pytest -q
